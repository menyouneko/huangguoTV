name: Build APK

on:
  workflow_dispatch:        # 手动触发
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # 可选签名：仓库配置了 KEYSTORE_BASE64 / KEYSTORE_PASSWORD /
      # KEY_ALIAS / KEY_PASSWORD 四个 Secrets 才生效，未配置则产物为未签名 APK
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > huangguo-release.jks
            echo "KEYSTORE_READY=true" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_READY=false" >> "$GITHUB_ENV"
            echo "!! 未配置签名 Secrets，本次产物为未签名 APK"
          fi

      - name: Build signed release APK
        if: env.KEYSTORE_READY == 'true'
        env:
          HUANGGUO_KEYSTORE: ${{ github.workspace }}/huangguo-release.jks
          HUANGGUO_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          HUANGGUO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HUANGGUO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash ./gradlew assembleRelease --no-daemon

      - name: Build unsigned release APK
        if: env.KEYSTORE_READY != 'true'
        run: bash ./gradlew assembleRelease --no-daemon

      # debug 包使用调试密钥自动签名，任何手机都可直接安装（兜底用）
      - name: Build debug APK
        run: bash ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: huangguoTV-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
